
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR ICE LAB — Dua Kamera</title>

<!-- PILIH KAMERA SEBELUM MINDAR BERMULA -->
<script>
const CAMERA_MODE =
  new URLSearchParams(location.search).get('kamera') === 'depan'
    ? 'user'
    : 'environment';

if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  const originalGetUserMedia =
    navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

  navigator.mediaDevices.getUserMedia = function(constraints) {
    const settings = {
      ...(typeof constraints?.video === 'object'
        ? constraints.video
        : {})
    };

    settings.facingMode = { exact: CAMERA_MODE };
    delete settings.deviceId;

    return originalGetUserMedia({
      ...constraints,
      audio: false,
      video: settings
    });
  };
}

function tukarKamera() {
  const url = new URL(location.href);

  url.searchParams.set(
    'kamera',
    CAMERA_MODE === 'user' ? 'belakang' : 'depan'
  );

  location.href = url.href;
}
</script>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, Arial, sans-serif;
  color: white;
  background: #071827;
}

/* PAPARAN KAMERA SEBENAR */
body > video {
  z-index: 0 !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: none !important;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1 !important;
  background: transparent !important;
}

a-scene canvas {
  background: transparent !important;
}

#shade {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    #041426da,
    transparent 30%,
    transparent 68%,
    #041426eb
  );
}

header {
  position: fixed;
  z-index: 5;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.title {
  font-weight: 900;
  font-size: 17px;
  letter-spacing: .07em;
  text-shadow: 0 2px 8px #001;
}

.label {
  border: 1px solid #83e1fb;
  border-radius: 100px;
  padding: 7px 11px;
  background: #082c46df;
  font-size: 12px;
  font-weight: 800;
}

#status {
  font-size: 13px;
  font-weight: 750;
  text-shadow: 0 1px 5px #000;
}

#info {
  font-size: 12px;
  color: #d1eefe;
  max-width: 560px;
  line-height: 1.4;
  text-shadow: 0 1px 4px #000;
}

#scan {
  position: fixed;
  z-index: 3;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 2px dashed #bceafa;
  border-radius: 16px;
  padding: 29px 15px;
  pointer-events: none;
  text-align: center;
  background: #102f4525;
  font-weight: 800;
  max-width: 240px;
  font-size: 13px;
}

#scan.hidden {
  display: none;
}

/* SIMBOL API DAN SALJI */
#zones {
  position: fixed;
  z-index: 5;
  left: 0;
  right: 0;
  top: 49%;
  display: flex;
  justify-content: space-between;
  padding: 0 clamp(7px, 3vw, 22px);
  pointer-events: none;
}

.zone {
  pointer-events: auto;
  border: 2px solid #b8dceda0;
  border-radius: 18px;
  width: 110px;
  height: 116px;
  background: #0b2539bb;
  color: white;
  font-size: 12px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 4px;
  touch-action: none;
  user-select: none;
  box-shadow: 0 10px 30px #0003;
}

.zone b {
  font-size: 38px;
  line-height: 1.1;
}

.zone .track {
  width: 75%;
  height: 5px;
  background: #ffffff35;
  border-radius: 9px;
  overflow: hidden;
}

.zone .fill {
  height: 100%;
  width: 0;
  background: #f3ffff;
  display: block;
}

.zone.hot {
  border-color: #ffaf7a;
}

.zone.cold {
  border-color: #8ee0ff;
}

.zone.active {
  box-shadow: 0 0 25px #ffffff7c;
  transform: scale(1.05);
}

#hint {
  position: fixed;
  z-index: 4;
  top: calc(49% + 122px);
  left: 8px;
  right: 8px;
  text-align: center;
  pointer-events: none;
  font-size: 12px;
  font-weight: 750;
  text-shadow: 0 1px 5px #000;
}

footer {
  position: fixed;
  z-index: 6;
  bottom: max(13px, env(safe-area-inset-bottom));
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.cam {
  border: 1px solid #a2def3;
  background: #123d5fea;
  color: white;
  font-size: 12px;
  padding: 12px;
  border-radius: 11px;
  font-weight: 850;
  cursor: pointer;
}

#steps {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: end;
}

#steps span {
  font-size: 10px;
  font-weight: 800;
  border-radius: 80px;
  border: 1px solid #badbf86b;
  background: #092436c9;
  padding: 7px 9px;
}

#steps span.sel {
  background: #d2f6ff;
  color: #0c3244;
}

@media(max-width:360px) {
  .zone {
    width: 90px;
    height: 101px;
  }

  .zone b {
    font-size: 32px;
  }

  #hint {
    top: calc(49% + 107px);
  }

  footer {
    align-items: end;
    flex-direction: column-reverse;
  }
}
</style>
</head>

<body>

<!-- GAMBAR AIS KEKAL TARGET INDEX 0 -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1; uiScanning: yes;"
  renderer="alpha: true; antialias: true; colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="ice-marker"
    mindar-image-target="targetIndex: 0">

    <a-entity id="balls"></a-entity>

    <a-text
      id="ar-title"
      value="PEPEJAL"
      color="#ffffff"
      align="center"
      position="0 .68 0"
      width="2.3">
    </a-text>

  </a-entity>
</a-scene>

<div id="shade"></div>

<header>
  <div class="bar">
    <span class="title">🧊 AR ICE LAB</span>
    <span class="label" id="phaseTitle">PEPEJAL • AIS</span>
  </div>

  <div id="status">
    Benarkan kamera dan imbas gambar AIS.
  </div>

  <div id="info">
    Zarah pepejal tersusun rapat, teratur dan
    bergetar pada kedudukan tetap.
  </div>
</header>

<div id="scan">
  HALAKAN KAMERA KE GAMBAR AIS
</div>

<div id="zones">
  <button type="button" class="zone cold" id="cold">
    <b>❄️</b>
    SEJUKKAN
    <div class="track">
      <i class="fill" id="coldFill"></i>
    </div>
  </button>

  <button type="button" class="zone hot" id="hot">
    <b>🔥</b>
    PANASKAN
    <div class="track">
      <i class="fill" id="hotFill"></i>
    </div>
  </button>
</div>

<div id="hint">
  Gerakkan gambar AIS ke 🔥 atau ❄️.
  Boleh juga tekan dan tahan simbol.
</div>

<footer>
  <button
    type="button"
    class="cam"
    onclick="tukarKamera()"
    id="cameraSwitch">
    ⇄ TUKAR KAMERA
  </button>

  <div id="steps">
    <span class="sel" id="solidStep">AIS</span>
    <span id="liquidStep">AIR</span>
    <span id="gasStep">WAP AIR</span>
  </div>
</footer>

<script>
'use strict';

document.getElementById('cameraSwitch').textContent =
  CAMERA_MODE === 'user'
    ? '⇄ KE KAMERA BELAKANG'
    : '⇄ KE KAMERA DEPAN';

const marker = document.getElementById('ice-marker');
const root = document.getElementById('balls');
const scene = document.querySelector('a-scene');

const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');

const hot = document.getElementById('hot');
const cold = document.getElementById('cold');

const fills = [
  document.getElementById('coldFill'),
  document.getElementById('hotFill')
];

const label = document.getElementById('phaseTitle');
const arTitle = document.getElementById('ar-title');

const texts = [
  [
    'PEPEJAL • AIS',
    'Zarah tersusun rapat, teratur dan bergetar pada kedudukan tetap.'
  ],
  [
    'CECAIR • AIR',
    'Zarah berdekatan dan boleh bergerak meluncur antara satu sama lain.'
  ],
  [
    'GAS • WAP AIR',
    'Zarah berjauhan dan bergerak bebas secara rawak.'
  ]
];

let state = 0;
let seen = false;
let zone = '';
let manual = '';
let elapsed = 0;
let last = performance.now();

const HOLD = 2300;
const particles = [];
const vector = new THREE.Vector3();

/* BINA ZARAH 3D */
for (let i = 0; i < 27; i++) {
  const el = document.createElement('a-sphere');

  el.setAttribute('radius', '.059');
  el.setAttribute('color', '#66d7f4');
  el.setAttribute(
    'material',
    'roughness: .4; metalness: .1'
  );

  root.appendChild(el);

  particles.push({
    el,
    base: new THREE.Vector3(),
    vel: new THREE.Vector3()
  });
}

function rand(i, k) {
  const a = Math.sin(
    (i + 1) * 23.34 + k * 56.15
  ) * 54852.64;

  return a - Math.floor(a);
}

/* SUSUN ZARAH MENGIKUT KEADAAN JIRIM */
function setupParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    if (state === 0) {
      p.base.set(
        (i % 3 - 1) * .19,
        (Math.floor(i / 9) - 1) * .19,
        (Math.floor(i / 3) % 3 - 1) * .19
      );
    }

    if (state === 1) {
      p.base.set(
        (i % 3 - 1) * .225 + (rand(i, 2) - .5) * .04,
        -.25 + Math.floor(i / 9) * .18,
        (Math.floor(i / 3) % 3 - 1) * .22
      );
    }

    if (state === 2) {
      p.base.set(
        (rand(i, 2) - .5) * 1.0,
        (rand(i, 3) - .5) * .95,
        (rand(i, 4) - .5) * .8
      );
    }

    p.vel.set(
      (rand(i, 11) - .5) * .58,
      (rand(i, 12) - .5) * .50,
      (rand(i, 13) - .5) * .54
    );

    p.el.object3D.position.copy(p.base);
  }
}

/* PERUBAHAN PEPEJAL, CECAIR DAN GAS */
function setState(n) {
  n = Math.max(0, Math.min(2, n));

  if (state === n) return;

  const old = state;
  state = n;
  elapsed = 0;

  label.textContent = texts[n][0];

  arTitle.setAttribute(
    'value',
    ['PEPEJAL', 'CECAIR', 'GAS'][n]
  );

  let process = '';

  if (n > old) {
    process = n === 1
      ? 'Pencairan: ais menerima haba. '
      : 'Pengewapan: air menerima haba. ';
  } else {
    process = n === 1
      ? 'Kondensasi: gas kehilangan haba. '
      : 'Pembekuan: air kehilangan haba. ';
  }

  infoEl.textContent = process + texts[n][1];

  setupParticles();

  ['solidStep', 'liquidStep', 'gasStep']
    .forEach((id, i) => {
      document.getElementById(id)
        .classList.toggle('sel', i === state);
    });
}

/* KESAN GAMBAR AIS */
marker.addEventListener('targetFound', () => {
  seen = true;

  document.getElementById('scan')
    .classList.add('hidden');

  statusEl.textContent =
    'Gambar AIS dikesan. Cuba kawasan api dan salji.';
});

marker.addEventListener('targetLost', () => {
  seen = false;
  zone = '';
  elapsed = 0;

  document.getElementById('scan')
    .classList.remove('hidden');

  statusEl.textContent =
    'Halakan semula kamera pada gambar AIS.';
});

scene.addEventListener('arError', () => {
  statusEl.textContent =
    'Kamera tidak dapat dimulakan. Benarkan akses atau cuba kamera satu lagi.';
});

scene.addEventListener('arReady', () => {
  statusEl.textContent =
    'Kamera sedia. Imbas gambar AIS.';
});

/* KIRA KEDUDUKAN GAMBAR DALAM KAMERA */
function projectMarker() {
  if (!seen || !scene.camera || !scene.canvas) {
    return null;
  }

  marker.object3D.getWorldPosition(vector);
  vector.project(scene.camera);

  if (!Number.isFinite(vector.x) ||
      Math.abs(vector.z) > 1) {
    return null;
  }

  const r = scene.canvas.getBoundingClientRect();

  return {
    x: r.left + (vector.x + 1) * r.width * .5,
    y: r.top + (1 - vector.y) * r.height * .5
  };
}

function inside(point, button) {
  const r = button.getBoundingClientRect();

  const x = r.left + r.width / 2;
  const y = r.top + r.height / 2;

  return Math.abs(point.x - x) < r.width * .65 &&
         Math.abs(point.y - y) < r.height * .65;
}

/* KAWALAN SENTUH JIKA PENANDA SUKAR DIKESAN */
for (const [el, key] of [
  [hot, 'hot'],
  [cold, 'cold']
]) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    manual = key;
    el.setPointerCapture?.(e.pointerId);
  });

  for (const ev of [
    'pointerup',
    'pointercancel',
    'lostpointercapture'
  ]) {
    el.addEventListener(ev, () => {
      manual = '';
    });
  }
}

/* ANIMASI PERGERAKAN ZARAH */
function animate(t) {
  const dt = Math.min(
    60,
    Math.max(0, t - last)
  );

  last = t;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    const o = p.el.object3D.position;
    const b = p.base;

    // PEPEJAL: BERGETAR
    if (state === 0) {
      o.set(
        b.x + Math.sin(t * .014 + i) * .007,
        b.y + Math.cos(t * .015 + i) * .007,
        b.z + Math.sin(t * .012 + i) * .007
      );
    }

    // CECAIR: MELUNCUR
    if (state === 1) {
      o.set(
        b.x + Math.sin(t * .0017 + i * 1.3) * .045,
        b.y + Math.cos(t * .0015 + i) * .022,
        b.z + Math.sin(t * .0014 + i * 2) * .045
      );
    }

    // GAS: BERGERAK BEBAS
    if (state === 2) {
      o.addScaledVector(
        p.vel,
        dt / 1000
      );

      for (const axis of ['x', 'y', 'z']) {
        const limit = axis === 'y' ? .48 : .51;

        if (Math.abs(o[axis]) > limit) {
          o[axis] = Math.sign(o[axis]) * limit;
          p.vel[axis] *= -1;
        }
      }
    }
  }

  let which = manual;

  if (!which) {
    const p = projectMarker();

    if (p) {
      if (inside(p, hot)) {
        which = 'hot';
      } else if (inside(p, cold)) {
        which = 'cold';
      }
    }
  }

  if (which !== zone) {
    zone = which;
    elapsed = 0;
  }

  if (which) {
    const possible = which === 'hot'
      ? state < 2
      : state > 0;

    if (possible) {
      elapsed += dt;

      if (elapsed >= HOLD) {
        setState(
          state + (which === 'hot' ? 1 : -1)
        );

        elapsed = 0;
      }
    } else {
      elapsed = 0;
    }

    statusEl.textContent = possible
      ? (which === 'hot'
          ? 'Pemanasan sedang berlaku...'
          : 'Penyejukan sedang berlaku...')
      : 'Keadaan akhir telah dicapai.';

  } else if (seen) {
    statusEl.textContent =
      'Gerakkan gambar AIS ke 🔥 atau ❄️.';
  }

  hot.classList.toggle(
    'active',
    which === 'hot'
  );

  cold.classList.toggle(
    'active',
    which === 'cold'
  );

  fills[0].style.width =
    (which === 'cold' ? elapsed / HOLD * 100 : 0) + '%';

  fills[1].style.width =
    (which === 'hot' ? elapsed / HOLD * 100 : 0) + '%';

  requestAnimationFrame(animate);
}

setupParticles();
requestAnimationFrame(animate);
</script>

</body>
</html>
