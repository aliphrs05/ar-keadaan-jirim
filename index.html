<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Keadaan Jirim</title>

  <!-- A-Frame dan MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    #panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.92);
      padding: 12px;
      border-radius: 14px;
      text-align: center;
    }

    h1 {
      font-size: 21px;
      margin: 0 0 6px;
    }

    #status {
      font-size: 14px;
      margin: 5px 0;
      color: #bae6fd;
    }

    #description {
      font-size: 13px;
      line-height: 1.5;
      margin: 5px 0 10px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #38bdf8;
      color: #082f49;
    }

    button:last-child {
      background: #fde68a;
      color: #713f12;
    }

    #help {
      position: fixed;
      bottom: 8px;
      left: 8px;
      right: 8px;
      z-index: 10;
      text-align: center;
      font-size: 12px;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px;
      border-radius: 10px;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="panel">
    <h1>🧊 AR Keadaan Jirim 🔥</h1>
    <div id="status">Sediakan kad AIS dan HABA</div>
    <div id="description">
      Pepejal: zarah rapat dan bergetar pada kedudukan tetap.
    </div>
    <div class="buttons">
      <button id="heat">🔥 Tambah Haba</button>
      <button id="cool">❄️ Sejukkan</button>
    </div>
  </div>

  <div id="help">
    Benarkan akses kamera. Imbas kad AIS dahulu.
    Dekatkan kad HABA untuk menunjukkan perubahan keadaan.
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: true;
                  uiScanning: yes;
                  maxTrack: 2;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Sasaran pertama: kad AIS -->
    <a-entity id="ice-anchor" mindar-image-target="targetIndex: 0">

      <a-entity id="particle-model">

        <!-- Label keadaan jirim -->
        <a-text
          id="model-title"
          value="PEPEJAL"
          position="0 1.05 0"
          align="center"
          color="#ffffff"
          width="3.5">
        </a-text>

        <!-- Zarah dijana melalui JavaScript -->
        <a-entity id="particles"></a-entity>

        <a-text
          value="Model zarah"
          position="0 -0.85 0"
          align="center"
          color="#ffffff"
          width="2.5">
        </a-text>

      </a-entity>
    </a-entity>

    <!-- Sasaran kedua: kad HABA -->
    <a-entity id="heat-anchor" mindar-image-target="targetIndex: 1">
      <a-ring
        position="0 0 0.01"
        radius-inner="0.28"
        radius-outer="0.34"
        color="#fb923c"
        material="shader: flat">
      </a-ring>
    </a-entity>

  </a-scene>

  <script>
    const particlesContainer = document.querySelector("#particles");
    const statusText = document.querySelector("#status");
    const description = document.querySelector("#description");
    const modelTitle = document.querySelector("#model-title");

    const iceAnchor = document.querySelector("#ice-anchor");
    const heatAnchor = document.querySelector("#heat-anchor");

    let phase = "solid";
    let iceVisible = false;
    let heatVisible = false;
    let particles = [];

    const explanations = {
      solid: {
        title: "PEPEJAL",
        status: "Keadaan jirim: Pepejal",
        description:
          "Zarah tersusun rapat dan hanya bergetar pada kedudukan tetap. Contoh: ais."
      },
      liquid: {
        title: "CECAIR",
        status: "Keadaan jirim: Cecair",
        description:
          "Zarah masih rapat tetapi boleh bergerak dan meluncur antara satu sama lain. Ais mencair menjadi air."
      },
      gas: {
        title: "GAS",
        status: "Keadaan jirim: Gas",
        description:
          "Zarah berjauhan dan bergerak bebas dengan pantas. Air boleh menjadi wap air apabila menerima haba."
      }
    };

    function createParticles() {
      particlesContainer.innerHTML = "";
      particles = [];

      for (let i = 0; i < 27; i++) {
        const sphere = document.createElement("a-sphere");
        sphere.setAttribute("radius", "0.075");
        sphere.setAttribute("color", "#38bdf8");
        sphere.setAttribute("material", "roughness: 0.35");

        particlesContainer.appendChild(sphere);
        particles.push(sphere);
      }

      renderParticles();
    }

    function renderParticles() {
      particles.forEach((sphere, i) => {
        let x, y, z;

        if (phase === "solid") {
          // Susunan teratur dan rapat
          x = ((i % 3) - 1) * 0.23;
          y = (Math.floor(i / 9) - 1) * 0.23 + 0.1;
          z = ((Math.floor(i / 3) % 3) - 1) * 0.23;
          sphere.setAttribute("color", "#38bdf8");

        } else if (phase === "liquid") {
          // Zarah rapat tetapi kurang teratur
          const angle = i * 2.399;
          const radius = 0.12 + (i % 4) * 0.075;
          x = Math.cos(angle) * radius;
          y = 0.05 + (i % 5) * 0.09;
          z = Math.sin(angle) * radius;
          sphere.setAttribute("color", "#34d399");

        } else {
          // Zarah berjauhan
          const angle = i * 2.399;
          const radius = 0.18 + (i % 4) * 0.18;
          x = Math.cos(angle) * radius;
          y = -0.05 + (i % 7) * 0.17;
          z = Math.sin(angle) * radius;
          sphere.setAttribute("color", "#fb923c");
        }

        sphere.setAttribute("position", `${x} ${y} ${z}`);
      });
    }

    function setPhase(newPhase) {
      phase = newPhase;
      const info = explanations[phase];

      modelTitle.setAttribute("value", info.title);
      statusText.textContent = info.status;
      description.textContent = info.description;

      renderParticles();
    }

    // Imbas kad AIS
    iceAnchor.addEventListener("targetFound", () => {
      iceVisible = true;
      updateFromCards();
    });

    iceAnchor.addEventListener("targetLost", () => {
      iceVisible = false;
      updateFromCards();
    });

    // Imbas kad HABA
    heatAnchor.addEventListener("targetFound", () => {
      heatVisible = true;
      updateFromCards();
    });

    heatAnchor.addEventListener("targetLost", () => {
      heatVisible = false;
      updateFromCards();
    });

    function updateFromCards() {
      if (iceVisible && heatVisible) {
        setPhase("liquid");
        statusText.textContent =
          "Kedua-dua kad dikesan: Haba menyebabkan ais mencair.";
      } else if (iceVisible) {
        setPhase("solid");
        statusText.textContent =
          "Kad AIS dikesan. Tekan Tambah Haba untuk meneruskan.";
      } else if (heatVisible) {
        statusText.textContent =
          "Kad HABA dikesan. Imbas kad AIS bersama-sama.";
      } else {
        statusText.textContent =
          "Halakan kamera ke kad AIS dan HABA.";
      }
    }

    document.querySelector("#heat").addEventListener("click", () => {
      if (phase === "solid") {
        setPhase("liquid");
      } else if (phase === "liquid") {
        setPhase("gas");
      }
    });

    document.querySelector("#cool").addEventListener("click", () => {
      if (phase === "gas") {
        setPhase("liquid");
      } else if (phase === "liquid") {
        setPhase("solid");
      }
    });

    createParticles();
  </script>
</body>
</html>
